[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Sync URL only — asyncpg doesn't work in Alembic's synchronous context
# Override at runtime with: alembic -x url=<value> upgrade head
# Or set DATABASE_SYNC_URL in .env
sqlalchemy.url = %(DATABASE_SYNC_URL)s

[post_write_hooks]
# Run ruff format on generated migration files
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
