[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "S",   # bandit (security)
  "N",   # pep8-naming
]
ignore = [
  "S101",  # assert in tests is fine
  "B008",  # FastAPI Depends() in function defaults
  "N811",  # sqlalchemy.dialects.postgresql.UUID as PgUUID — pep8-naming misreads
           # the class name UUID as a constant; the alias avoids clashing with
           # Python's own uuid.UUID and is the idiomatic pattern for this import.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"migrations/**" = ["E501", "N999"]
"scripts/seed_culture.py" = ["E501"]  # long-form Japanese Markdown seed content

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
# celery has no py.typed marker / published stubs; the app doesn't use it at
# runtime (FastAPI BackgroundTasks replaced it — see workers/*.py), so treat
# it as untyped rather than pulling in a stub package for dead code.
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=70"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
]
