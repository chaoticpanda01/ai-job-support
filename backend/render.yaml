services:
  - type: web
    name: ai-job-support-api
    runtime: python
    # Render applies this file only to a Blueprint-managed service. Otherwise the
    # plan, root directory, and commands below must match the service's settings
    # in the dashboard (Settings > Build & Deploy).
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run here, not in preDeployCommand, which Render doesn't offer on
    # the free plan. On an up-to-date database, alembic only reads alembic_version.
    # The [start] lines show in the log whether this command is in effect and
    # whether the migration finished.
    #
    # If a migration fails during a deploy, the deploy fails and the previous
    # deploy keeps serving. A wake from sleep or a restart has no previous
    # instance to fall back on: a failure then (database unreachable, a bad
    # DATABASE_SYNC_URL, or code older than the database after a rollback) leaves
    # the API down until it's fixed. Rolling back past a migration needs
    # `alembic downgrade` first.
    startCommand: echo "[start] running alembic upgrade head" && alembic upgrade head && echo "[start] migrations applied, starting uvicorn" && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        value: ai-job-support
      - key: CLOUDFLARE_R2_ENDPOINT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
