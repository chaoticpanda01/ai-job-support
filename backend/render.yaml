services:
  - type: web
    name: ai-job-support-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Migrations run here, not in preDeployCommand: Render only runs a pre-deploy
    # command on paid plans, and this service is on the free tier. Upgrading an
    # up-to-date database is a quick no-op, so this also runs harmlessly on every
    # restart and wake from sleep. If a migration fails, uvicorn never starts, the
    # deploy fails, and Render keeps serving the previous deploy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        value: ai-job-support
      - key: CLOUDFLARE_R2_ENDPOINT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
